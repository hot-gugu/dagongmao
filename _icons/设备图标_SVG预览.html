<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设备运行图层 · 传感器矢量图标预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#071726;color:#cfe6f5;font-family:"Microsoft YaHei",system-ui,sans-serif;padding:32px 24px 60px}
  h1{font-size:22px;font-weight:600;letter-spacing:1px;margin-bottom:6px}
  .sub{color:#7f9ab5;font-size:13px;margin-bottom:28px}
  .grid{display:flex;flex-direction:column;gap:14px;max-width:960px}
  .row{display:flex;align-items:center;gap:26px;background:rgba(13,33,52,.55);border:1px solid rgba(85,219,234,.14);border-radius:14px;padding:14px 20px}
  .row .name{width:150px;font-size:15px;font-weight:600;color:#e8f4fc}
  .state{display:flex;align-items:center;gap:12px}
  .state .badge{font-size:12px;padding:3px 9px;border-radius:20px}
  .badge.on{background:rgba(85,219,234,.15);color:#55dbea;border:1px solid rgba(85,219,234,.4)}
  .badge.off{background:rgba(90,106,122,.15);color:#8a9aaa;border:1px solid rgba(138,154,170,.35)}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:110px}
  .note{margin-top:30px;max-width:960px;font-size:12.5px;line-height:2;color:#7f9ab5}
  .note b{color:#9fd8ea}
  .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>
  <h1>设备运行图层 · 传感器矢量图标预览</h1>
  <div class="sub">7 种设备 × 在线/离线两态 · 内联 SVG（44×56）· 可直接缩放到任意尺寸不失真</div>
  <div class="grid" id="grid"></div>
  <div class="note">
    配色规则：<b>在线</b>＝每种设备专属亮色（用于地图区分设备类型），<b>离线</b>＝统一中性灰（与现有摄像头离线一致）。<br>
    图标结构：外圈光圈 + 主体图形 + 深色内芯 <span style="color:#0a1a2a;background:#7f9ab5;padding:0 5px;border-radius:3px">#0a1a2a</span> + 高光 + 底部底座，与现有摄像头/传感器图标同一套视觉语言。<br>
    确认后，这些 SVG 会直接嵌入大屏「风险预警 → 设备运行」图层，替换现在的摄像头/传感器两类图标逻辑。
  </div>

<script>
const TYPES=[
  {key:'pressure', name:'压力传感器',   color:'#55dbea', light:'#a8f0f8'},
  {key:'level',    name:'液位传感器',   color:'#5ab0ff', light:'#b8dcff'},
  {key:'temp',     name:'温度传感器',   color:'#4fd8c2', light:'#b0f0e6'},
  {key:'dust',     name:'粉尘监测设备', color:'#6ee77a', light:'#c2f5c8'},
  {key:'water',    name:'水位计',       color:'#35e0c0', light:'#aef5e8'},
  {key:'gnss',     name:'GNSS位移传感器',color:'#b58aff', light:'#d8c0ff'},
  {key:'terminal', name:'工业智能终端', color:'#ff7ad9', light:'#ffc2ee'}
];
const GRAY='#5a6a7a', GRAY_LIGHT='#8a9aaa';

function icon(key, offline){
  const t=TYPES.find(x=>x.key===key);
  const c=offline?GRAY:t.color, l=offline?GRAY_LIGHT:t.light;
  let b='';
  switch(key){
    case 'pressure': // 压力表盘
      b='<circle cx="22" cy="27" r="12" fill="'+c+'"/>'
       +'<circle cx="22" cy="27" r="9" fill="#0a1a2a"/>'
       +'<line x1="22" y1="27" x2="22" y2="20.5" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round"/>'
       +'<circle cx="22" cy="27" r="1.5" fill="'+c+'"/>'
       +'<circle cx="20.3" cy="25" r="1" fill="'+l+'"/>'
       +'<rect x="19" y="38" width="6" height="5" fill="'+c+'" fill-opacity="0.7"/>'
       +'<rect x="17" y="43" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'level': // 储液罐+液面刻度
      b='<rect x="14" y="17" width="16" height="24" rx="3" fill="'+c+'"/>'
       +'<rect x="15.5" y="18.5" width="13" height="21" rx="2" fill="#0a1a2a"/>'
       +'<rect x="15.5" y="25" width="13" height="14.5" rx="2" fill="'+c+'" fill-opacity="0.8"/>'
       +'<rect x="15.5" y="24.5" width="13" height="1.6" fill="'+l+'" opacity="0.9"/>'
       +'<line x1="30" y1="22" x2="32.5" y2="22" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="30" y1="28" x2="32.5" y2="28" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="30" y1="34" x2="32.5" y2="34" stroke="'+c+'" stroke-width="1"/>'
       +'<circle cx="18" cy="21" r="1.2" fill="'+l+'"/>'
       +'<rect x="17" y="43" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'temp': // 温度计
      b='<circle cx="22" cy="20" r="6" fill="'+c+'"/>'
       +'<circle cx="22" cy="20" r="3.6" fill="#0a1a2a"/>'
       +'<circle cx="22" cy="20" r="2" fill="'+c+'"/>'
       +'<rect x="20.3" y="25" width="3.4" height="15" rx="1.7" fill="'+c+'"/>'
       +'<rect x="21.3" y="26" width="1.4" height="9" rx="0.7" fill="'+l+'"/>'
       +'<line x1="25" y1="29" x2="27" y2="29" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="25" y1="35" x2="27" y2="35" stroke="'+c+'" stroke-width="1"/>'
       +'<circle cx="20" cy="18.5" r="1" fill="'+l+'"/>'
       +'<rect x="17" y="42" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'dust': // 方形监测仪+悬浮颗粒
      b='<rect x="13" y="17" width="18" height="22" rx="4" fill="'+c+'"/>'
       +'<rect x="15" y="20" width="14" height="14" rx="2" fill="#0a1a2a"/>'
       +'<circle cx="19" cy="25" r="1.4" fill="'+l+'"/>'
       +'<circle cx="23.5" cy="28" r="1.1" fill="'+c+'"/>'
       +'<circle cx="20" cy="31" r="0.9" fill="'+c+'"/>'
       +'<circle cx="12.5" cy="14.5" r="1" fill="'+c+'" opacity="0.85"/>'
       +'<circle cx="30.5" cy="15" r="1.2" fill="'+c+'" opacity="0.7"/>'
       +'<circle cx="11.5" cy="30" r="1.1" fill="'+c+'" opacity="0.6"/>'
       +'<circle cx="31.5" cy="26" r="0.9" fill="'+c+'" opacity="0.8"/>'
       +'<rect x="16" y="21.5" width="4" height="1" rx="0.5" fill="'+l+'"/>'
       +'<rect x="17" y="41" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'water': // 水位标尺+波浪浮标
      b='<rect x="20" y="15" width="4" height="26" rx="1.5" fill="'+c+'"/>'
       +'<line x1="24" y1="19" x2="27" y2="19" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="24" y1="24" x2="27" y2="24" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="24" y1="29" x2="27" y2="29" stroke="'+c+'" stroke-width="1"/>'
       +'<line x1="24" y1="34" x2="27" y2="34" stroke="'+c+'" stroke-width="1"/>'
       +'<path d="M12 30 Q14.5 28 17 30 T22 30 T27 30 T32 30" stroke="'+c+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
       +'<circle cx="17" cy="30" r="3" fill="'+c+'"/>'
       +'<circle cx="17" cy="30" r="1.4" fill="#0a1a2a"/>'
       +'<circle cx="21" cy="17.5" r="1" fill="'+l+'"/>'
       +'<rect x="17" y="42" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'gnss': // 卫星天线+位移箭头
      b='<path d="M15 14 A9.5 9.5 0 0 1 29 14" stroke="'+c+'" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9"/>'
       +'<circle cx="22" cy="18" r="3.2" fill="'+c+'"/>'
       +'<circle cx="22" cy="18" r="1.6" fill="#0a1a2a"/>'
       +'<rect x="21" y="21" width="2" height="13" fill="'+c+'"/>'
       +'<path d="M27 30 L34 30 M32 27.5 L34.5 30 L32 32.5" stroke="'+c+'" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
       +'<circle cx="21" cy="17" r="1" fill="'+l+'"/>'
       +'<rect x="17" y="43" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
    case 'terminal': // 触摸屏面板+数据波形
      b='<rect x="12" y="16" width="20" height="25" rx="3.5" fill="'+c+'"/>'
       +'<rect x="14" y="19" width="16" height="17" rx="2" fill="#0a1a2a"/>'
       +'<polyline points="15.5,31 18.5,26 21,29 24,22 27,26 29,23" fill="none" stroke="'+l+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
       +'<rect x="15.5" y="21" width="4" height="2" rx="0.5" fill="'+c+'" opacity="0.8"/>'
       +'<rect x="21" y="21" width="6" height="2" rx="0.5" fill="'+c+'" opacity="0.8"/>'
       +'<rect x="15" y="19.8" width="5" height="1.2" rx="0.6" fill="'+l+'"/>'
       +'<rect x="17" y="41" width="10" height="4" rx="1" fill="'+c+'" fill-opacity="0.7"/>';
      break;
  }
  return '<svg viewBox="0 0 44 56" width="44" height="56">'
    +'<circle cx="22" cy="28" r="20" fill="'+c+'" fill-opacity="0.08"/>'
    +'<circle cx="22" cy="28" r="15" fill="'+c+'" fill-opacity="0.12"/>'
    + b
    +'</svg>';
}

(function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML=TYPES.map(t=>
    '<div class="row">'
    +'<div class="name">'+t.name+'</div>'
    +'<div class="cell"><div class="state"><span class="badge on">在线</span>'+icon(t.key,false)+'</div></div>'
    +'<div class="cell"><div class="state"><span class="badge off">离线</span>'+icon(t.key,true)+'</div></div>'
    +'</div>'
  ).join('');
})();
</script>
</body>
</html>
